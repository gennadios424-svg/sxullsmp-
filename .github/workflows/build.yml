name: Build SXULL Coinflip
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: SXULL-Coinflip
          path: target/SXULL-Coinflip-*.jar
          if-no-files-found: error
          retention-days: 30